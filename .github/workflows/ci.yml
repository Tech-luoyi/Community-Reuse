name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # 数据库不在这里声明，而是在下面第一个步骤里显式构建并起容器。
    # 为什么不用 services：`jobs.<job_id>.services.<id>` **不支持 `build` 键**（只有
    # `jobs.<job_id>.container` 支持）。把 build 写进 services 会让整个工作流在校验阶段
    # 就失败、连一个 job 都不生成 —— 表现是 CI 红却没有日志可读。
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community?schema=public
      SESSION_SECRET: ci-only-session-secret

    steps:
      - uses: actions/checkout@v4

      # 复用 `docker/db.Dockerfile`：与本地开发同一镜像、同一 pgvector apk，顺带让 CI
      # 验证这个 Dockerfile 本身仍可构建。
      # 为什么不能退回 `postgres:16-alpine`：迁移 0003 需要 `CREATE EXTENSION vector`，
      # 该镜像不含扩展，`prisma:deploy` 会 P3018 把流水线钉死（main 已因此连红三次）。
      # TZ=UTC 与 docker-compose.yml 同步（§4.3② 时钟源不变量），丢了会让新鲜度静默偏移一个时区。
      - name: Build & start PostgreSQL 16 with pgvector
        run: |
          set -euo pipefail
          docker build -t community-reuse-db:pg16-pgvector -f docker/db.Dockerfile .
          docker run -d --name db \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=community \
            -e TZ=UTC \
            community-reuse-db:pg16-pgvector
          tries=0
          until docker exec db pg_isready -U postgres -d community >/dev/null 2>&1; do
            tries=$((tries + 1))
            if [ "$tries" -gt 30 ]; then
              docker logs db
              exit 1
            fi
            sleep 2
          done
          # 只探测、不创建：迁移里是 `CREATE EXTENSION IF NOT EXISTS`，
          # 在这里先把扩展装上会掩盖「镜像里到底有没有它」这个真正要验的问题。
          docker exec db psql -U postgres -d community -At \
            -c "SELECT name FROM pg_available_extensions WHERE name = 'vector'" | grep -q vector

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # 覆盖率门禁（vitest.config.ts 的 thresholds）：必须在这里跑，
      # 否则阈值只是配置文件里的一行字，跌破也没人知道。
      - name: Unit tests (coverage gate)
        run: npm run test:coverage

      - name: Apply DB migrations
        run: npm run prisma:deploy

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Seed database
        run: npm run db:seed

      # checkpoint 表由 LangGraph 自管、不在 Prisma schema 内（§10 DDL 归属纪律）；
      # 集成测试会自建，但这里显式跑一次，才能证明 README 的一键启动路径真的走得通。
      - name: Set up LangGraph checkpoint tables
        run: npm run ai:setup-checkpoint

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
