name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # PostgreSQL 16 service container：供集成测试（迁移落地 / D3 兜底 / 索引命中 / §6.5 定价 SQL）真连库使用。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: community
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d community"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community?schema=public
      SESSION_SECRET: ci-only-session-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Apply DB migrations
        run: npm run prisma:deploy

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Seed database
        run: npm run db:seed

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
