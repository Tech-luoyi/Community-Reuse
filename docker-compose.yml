# 只跑数据库一个容器（与设计一致：MinIO 已砍，图片走本地 StorageAdapter）
services:
  db:
    # 本地构建而非直接 pull `pgvector/pgvector:pg16`：见 docker/db.Dockerfile 头部的三条实测结论。
    # `image` + `build` 并存：`compose up` 会构建并打上这个 tag；已配好镜像加速的环境也可
    # 改成 pull 现成镜像，数据目录格式同为 PG16，volume 不用动。
    image: community-reuse-db:pg16-pgvector
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    container_name: community-reuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community
      # 固化会话时区为 UTC（见 tech-design-final.md §4.3② 时钟源清单 / P13）。
      # 原因：含 `DEFAULT CURRENT_TIMESTAMP` 的列走 **会话时区**；而 Prisma Client 恒按 UTC 语义写入。
      # 二者只有在「DB 会话时区 = UTC」时才落在同一时间轴上，否则 raw 路径写入的行会
      # 与 Prisma 写入的行相差一个时区偏移，导致 `ageHours = (now() - publishedAt)` 静默出错。
      TZ: UTC
    # 宿主端口可通过 DB_PORT 覆盖（默认 5432）。
    # 有些开发机 5432 已被其它项目占用，此时在本地 .env 里设 DB_PORT=55433 即可，
    # 无需改动本文件（canonical 默认仍是 PG 标准端口 5432）。
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d community']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
